services:
  - type: web
    name: meetinglog
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: AI_PROVIDER
        value: cloud
      - key: HOST
        value: 0.0.0.0
      - key: APP_PASSWORD
        generateValue: true
      - key: STT_MODEL
        value: gpt-4o-transcribe
      - key: SUMMARY_MODEL
        value: gpt-4o-mini
